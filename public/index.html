<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10182b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NaviSpace" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <title>NaviSpace</title>
    <style>
        main {
            max-width: 560px;
        }
    </style>
</head>

<body>
    <header class="topbar">
        <a class="wordmark" href="/"><span class="wordmark-mark"></span>navispace</a>
    </header>

    <main>
        <h1 class="page-title">Choose a library</h1>
        <p class="page-subtitle">Live seat status, study leaderboards, and lost &amp; found — one per library.</p>

        <div class="library-grid" id="libraryGrid"></div>
    </main>

    <script src="/client.js"></script>
    <script>
        async function render() {
            const libraries = await getLibraries();
            const grid = document.getElementById("libraryGrid");
            grid.innerHTML = "";

            for (const lib of libraries) {
                const isActive = lib.status === "active";
                const el = document.createElement(isActive ? "a" : "div");
                el.className = "library-card" + (isActive ? "" : " is-soon");
                if (isActive) el.href = libraryUrl("/library.html", lib.id);

                const left = document.createElement("div");
                const name = document.createElement("div");
                name.className = "library-card-name";
                name.textContent = lib.name;
                left.appendChild(name);

                const meta = document.createElement("div");
                meta.className = "library-card-meta";
                meta.textContent = isActive
                    ? `${lib.seatCount} seat${lib.seatCount === 1 ? "" : "s"} tracked`
                    : "Not open for check-in yet";
                left.appendChild(meta);

                const status = document.createElement("div");
                status.className = "library-card-status " + (isActive ? "active" : "soon");
                status.textContent = isActive ? "Open" : "Coming soon";

                el.append(left, status);
                grid.appendChild(el);
            }
        }

        render();
    </script>
</body>

</html>
