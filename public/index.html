<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NaviSpace — Map</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 24px auto;
            padding: 0 16px;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        .zone-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .zone-label {
            width: 22px;
            font-weight: 700;
            color: #888;
            text-align: center;
            flex-shrink: 0;
        }

        .seats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .seat-tile {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            border: 3px solid transparent;
            color: white;
            text-decoration: none;
            user-select: none;
        }

        .seat-tile .staleness-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 3px;
        }

        .state-AVAILABLE {
            background: #2e9e50;
        }

        .state-OCCUPIED {
            background: #d1453b;
        }

        .state-STEPPED_AWAY {
            background: #c98a1a;
        }

        .staleness-high {
            border-color: rgba(255, 255, 255, 0.9);
        }

        .staleness-medium {
            border-color: rgba(255, 255, 255, 0.5);
            border-style: dashed;
        }

        .staleness-low {
            border-color: rgba(0, 0, 0, 0.35);
            border-style: dashed;
        }

        #empty {
            text-align: center;
            color: #888;
            margin-top: 40px;
        }

        .footer-links {
            text-align: center;
            margin-top: 28px;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #555;
            margin: 0 8px;
        }
    </style>
</head>

<body>
    <h1>Study Space Map</h1>
    <div class="subtitle">Live status only — scan a seat's QR code in person to check in</div>

    <div class="legend">
        <span><span class="swatch state-AVAILABLE"></span>Available</span>
        <span><span class="swatch state-OCCUPIED"></span>Occupied</span>
        <span><span class="swatch state-STEPPED_AWAY"></span>Stepped away</span>
        <span>Solid border = confirmed recently · dashed = getting stale</span>
    </div>

    <div id="map"></div>
    <p id="empty" style="display:none;">No seats configured yet.</p>

    <div class="footer-links">
        <a href="/leaderboard.html">Leaderboard</a>
    </div>

    <script src="/client.js"></script>
    <script>
        async function render() {
            const [seats, config] = await Promise.all([getAllSeats(), getServerConfig()]);
            const mapEl = document.getElementById("map");
            const emptyEl = document.getElementById("empty");
            mapEl.innerHTML = "";

            if (!seats.length) {
                emptyEl.style.display = "block";
                return;
            }
            emptyEl.style.display = "none";

            // Group seats into rows by zone (the letters in the seat ID),
            // sorted by their trailing number within each row — a simple
            // bird's-eye layout that works for any SEAT_IDS/SEAT_ZONES
            // configuration without needing hand-placed coordinates.
            const byZone = new Map();
            for (const seat of seats) {
                const { zone, number } = parseSeatId(seat.id);
                if (!byZone.has(zone)) byZone.set(zone, []);
                byZone.get(zone).push({ ...seat, _number: number });
            }

            const zones = [...byZone.keys()].sort();
            for (const zone of zones) {
                const row = document.createElement("div");
                row.className = "zone-row";

                const label = document.createElement("div");
                label.className = "zone-label";
                label.textContent = zone;
                row.appendChild(label);

                const seatsEl = document.createElement("div");
                seatsEl.className = "seats";

                const seatsInZone = byZone.get(zone).sort((a, b) => a._number - b._number);
                for (const seat of seatsInZone) {
                    seatsEl.appendChild(renderTile(seat, config));
                }

                row.appendChild(seatsEl);
                mapEl.appendChild(row);
            }
        }

        function renderTile(seat, config) {
            // A plain, non-interactive div on purpose: the map is a status
            // display only. Reserving a seat happens by scanning its actual
            // physical QR code (which links to seat.html) — there's no
            // click-through from here, so this tile never becomes a second,
            // unscanned way to "reserve" a seat.
            const div = document.createElement("div");
            div.className = `seat-tile state-${seat.state}`;

            const level = confidenceLevel(seat, config);
            if (level) div.classList.add(`staleness-${level}`);

            const idEl = document.createElement("div");
            idEl.textContent = seat.id;
            div.appendChild(idEl);

            if (level) {
                const dot = document.createElement("div");
                dot.className = "staleness-dot";
                dot.style.background =
                    level === "high" ? "rgba(255,255,255,0.9)" :
                        level === "medium" ? "rgba(255,255,255,0.6)" :
                            "rgba(0,0,0,0.4)";
                div.appendChild(dot);
            }

            return div;
        }

        render();
        setInterval(render, 10000); // keep the map reasonably live
    </script>
</body>

</html>
