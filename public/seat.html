<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121614" />
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

<meta property="og:description" content="Check in or out of this seat with NaviSpace." />

<style>
  main { display: flex; justify-content: center; }

  .seat-card {
    width: 100%;
    max-width: 400px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 32px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 30px 26px 26px;
  }

  .seat-card-label {
    font-family: var(--font-display);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 4px;
  }

  .seat-card-id {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 4.2rem;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0 0 22px;
  }

  .status-band {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 14px 18px;
    border-radius: 100px;
    margin-bottom: 18px;
  }

  .status-band.AVAILABLE { background: var(--green-dim); color: var(--green); }
  .status-band.OCCUPIED { background: var(--vermilion-dim); color: #ff8a73; }
  .status-band.STEPPED_AWAY { background: var(--amber-dim); color: var(--amber); }

  .actions { margin-bottom: 4px; }

  #enableReminders { margin-top: 10px; }
  #reportLink { display: block; text-align: left; margin-top: 4px; }

  .nickname-row {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .nickname-row input { flex: 1; min-width: 0; }
  .nickname-row button { width: auto; margin: 0; padding: 9px 14px; font-size: 0.85rem; }

  .modal-box { text-align: center; }
  .modal-box p { margin: 0 0 16px; font-size: 0.95rem; }

  /* --- Lamp over the floor ------------------------------------------------ */
  main { padding-top: 40px; }
  .seat-card {
    position: relative;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    padding: 34px 30px 28px;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.35);
  }
  .seat-card::before {
    content: "";
    position: absolute;
    left: 30px;
    right: 30px;
    top: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
  }
  .seat-card-label {
    font: 400 11px/1 var(--font-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seat-card-id {
    font: 400 104px/0.9 var(--font-serif);
    letter-spacing: -0.035em;
    margin: 22px 0 26px;
  }
  .status-band {
    border-radius: 0;
    border: 1px solid currentColor;
    font: 500 12.5px/1.2 var(--font-mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 15px 16px;
    gap: 12px;
  }
  .status-band.AVAILABLE { background: var(--free-dim); color: var(--free); }
  .status-band.OCCUPIED { background: var(--taken-dim); color: var(--taken); }
  .status-band.STEPPED_AWAY { background: var(--away-dim); color: var(--away); }
  .seat-focus {
    margin: -6px 0 18px;
    font: 400 12px/1.4 var(--font-mono);
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .seat-focus b { color: var(--free); font-weight: 500; font-variant-numeric: tabular-nums; }
  .nickname-row { border-top-color: var(--line); }

  /* One clear next step, the rest quieter beside it. */
  .status-band.AVAILABLE, .status-band.OCCUPIED, .status-band.STEPPED_AWAY { background: transparent; }
  .status-band { border-color: currentColor; border-color: color-mix(in srgb, currentColor 45%, transparent); }
  #actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  #actions .btn { margin: 0; }
  .scan-note {
    grid-column: 1 / -1; display: grid; gap: 6px; padding: 16px 18px;
    border: 1px dashed var(--line-strong); color: var(--muted); font-size: 14.5px;
  }
  .scan-note strong { color: var(--text); font: 400 19px/1.25 var(--font-serif); }
  #actions > .btn-primary, #actions > :only-child, #actions > :nth-child(2):last-child { grid-column: 1 / -1; }
  #actions > .btn-primary { padding-top: 18px; padding-bottom: 18px; }
  #enableReminders {
    background: none; border: 0; padding: 12px 0 4px; width: auto; margin: 6px 0 0;
    font: 400 italic 16px/1.3 var(--font-serif); letter-spacing: 0; text-transform: none;
    color: var(--brass); text-align: left; cursor: pointer;
  }
  #enableReminders:hover { text-decoration: underline; text-underline-offset: 4px; }
  .nickname-row button { padding: 13px 16px; font-size: 12px; }
</style>

</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><span class="wordmark-mark"></span>NaviSpace</a>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <div class="context-bar">
    <span class="library-name" id="libraryName">&nbsp;</span>
    <a href="/">Change library</a>
  </div>

  <main>
    <div class="seat-card">
      <div class="seat-card-label">Seat</div>
      <h1 class="seat-card-id" id="seatId">…</h1>

      <div id="status" class="status-band AVAILABLE">Loading…</div>
      <div class="seat-focus" id="seatFocus" hidden>Your focus session · <b id="seatFocusTime">00:00:00</b></div>
      <div id="actions" class="actions"></div>

      <button id="enableReminders" class="btn btn-tinted" style="display:none;">Remind me before my seat runs out</button>
      <button id="reportLink" class="btn-quiet" style="display:none;">This looks wrong — report it</button>
      <div id="toast" class="toast"></div>

      <div class="nickname-row">
        <input type="text" id="nicknameInput" placeholder="Your leaderboard nickname" maxlength="24" />
        <button id="nicknameSave" class="btn">Save</button>
      </div>
    </div>
  </main>

  <div id="modal" class="modal-overlay">
    <div class="modal-box">
      <p id="modalMessage"></p>
      <button class="btn btn-primary" id="modalKeepGoing">Keep going</button>
      <button class="btn" id="modalDone">I'm done</button>
    </div>
  </div>

  <script src="/client.js"></script>
  <script>
    const seatId = new URLSearchParams(window.location.search).get("seat");
    // No seat in the address (e.g. an app launched without one): go to the
    // seat this device holds, or to the map — never guess a seat.
    if (!seatId) {
      const token = localStorage.getItem("navispace_token");
      const fallback = libraryUrl("/library.html", getLibraryIdFromUrl());
      (token ? getHeldSeat(token) : Promise.resolve(null))
        .then((held) => window.location.replace(held && held.seatId
          ? `/seat.html?lib=${encodeURIComponent(held.libraryId)}&seat=${encodeURIComponent(held.seatId)}`
          : fallback))
        .catch(() => window.location.replace(fallback));
      throw new Error("no seat — redirecting");
    }
    // Defaults to "engineering" — see getLibraryIdFromUrl in client.js:
    // this keeps every QR code printed before multi-library support
    // existed working untouched.
    const libraryId = getLibraryIdFromUrl();
    document.getElementById("seatId").textContent = seatId;

    document.getElementById("topnav").innerHTML = `
      <a href="/">Home</a>
      <a href="${libraryUrl("/library.html", libraryId)}">Map</a>
      <a href="${libraryUrl("/leaderboard.html", libraryId)}">Study board</a>
      <a href="${libraryUrl("/lost-found.html", libraryId)}">Lost &amp; found</a>
    `;
    getLibraries().then((libs) => {
      const lib = libs.find((l) => l.id === libraryId);
      document.getElementById("libraryName").textContent = lib ? lib.name : libraryId;
    });

    const identity = getOrCreateIdentity();
    let promptTimer = null;
    let reminderEnabled = false;

    const nicknameInput = document.getElementById("nicknameInput");
    nicknameInput.value = identity.nickname === "Anonymous" ? "" : identity.nickname;
    document.addEventListener("navispace:nickname", (e) => { nicknameInput.value = e.detail || ""; });
    document.getElementById("nicknameSave").onclick = () => {
      identity.nickname = setNickname(nicknameInput.value);
      nicknameInput.value = identity.nickname;
      toast("Nickname saved.");
    };

    const ENCOURAGEMENT = [
      "Keep going — you've got this!",
      "Nice focus. Stay with it!",
      "One more stretch. You're doing great.",
      "Still here? Good. Keep the momentum.",
    ];
    function randomEncouragement() {
      return ENCOURAGEMENT[Math.floor(Math.random() * ENCOURAGEMENT.length)];
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 6000);
    }

    // Whether checking in needs the code from the desk's sticker, and
    // whether this tab has it (it arrives with the scan).
    let codeRequired = false;
    let lastSeat = null;
    getServerConfig().then((c) => {
      codeRequired = Boolean(c && c.SEAT_CODE_REQUIRED);
      if (codeRequired && lastSeat) render(lastSeat);
    }).catch(() => { });

    function scanNote() {
      const note = document.createElement("div");
      note.className = "scan-note";
      note.innerHTML = "<strong>Scan the code on this desk to check in.</strong><span>Seats can only be claimed from the desk itself, so nobody can hold one from outside the library.</span>";
      return note;
    }

    function render(seat) {
      lastSeat = seat;
      if (seat && seat.reason === "unknown_seat") {
        renderUnknownSeat();
        return;
      }
      const statusEl = document.getElementById("status");
      statusEl.className = "status-band " + seat.state;
      statusEl.innerHTML = "";
      const dot = document.createElement("span");
      dot.className = "signal-dot signal-" + seat.state;
      statusEl.appendChild(dot);
      const label = document.createElement("span");
      label.textContent =
        seat.state === "AVAILABLE" ? "Available" :
        seat.state === "OCCUPIED" ? (isMine(seat.holderHash) ? "You're checked in" : "Occupied") :
        "Stepped away (holding seat)";
      statusEl.appendChild(label);

      const actions = document.getElementById("actions");
      actions.innerHTML = "";

      const isHolder = isMine(seat.holderHash);

      // The holder sees how long this sitting has lasted.
      focusSeat = isHolder && seat.state !== "AVAILABLE" && seat.sessionStart ? seat : null;
      document.getElementById("seatFocus").hidden = !focusSeat;
      tickSeatFocus();

      if (seat.state === "AVAILABLE") {
        if (codeRequired && !seatCodeFor(libraryId, seatId)) actions.appendChild(scanNote());
        else actions.appendChild(makeButton("Check in", true, () => act("checkIn")));
      } else if (seat.state === "OCCUPIED" && isHolder) {
        const focusLink = document.createElement("a");
        focusLink.className = "btn btn-primary";
        focusLink.href = `/focus.html?lib=${encodeURIComponent(libraryId)}&seat=${encodeURIComponent(seatId)}`;
        focusLink.textContent = "Start focus session";
        actions.appendChild(focusLink);
        actions.appendChild(makeButton("Step away", false, () => act("stepAway")));
        actions.appendChild(makeButton("Check out", false, () => act("leaving")));
      } else if (seat.state === "STEPPED_AWAY" && isHolder) {
        actions.appendChild(makeButton("I'm back", true, () => act("imBack")));
        actions.appendChild(makeButton("Check out", false, () => act("leaving")));
      } else {
        actions.appendChild(makeButton("Refresh", false, refresh));
      }

      // Crowdsourced correction: only meaningful when the seat claims
      // to be held by someone — reporting an already-AVAILABLE seat
      // has nothing to correct.
      const reportBtn = document.getElementById("reportLink");
      reportBtn.style.display = seat.state === "AVAILABLE" ? "none" : "inline-block";

      // Reminders are only useful to the person actually holding the
      // seat, and only worth offering once (reminderEnabled tracks
      // this tab's own successful subscribe, since there's no cheap
      // way to check push-subscription status without a service
      // worker round trip on every render).
      const reminderBtn = document.getElementById("enableReminders");
      reminderBtn.style.display = isHolder && !reminderEnabled ? "block" : "none";
    }

    function renderUnknownSeat() {
      const statusEl = document.getElementById("status");
      statusEl.className = "status-band STEPPED_AWAY";
      statusEl.textContent = "This seat isn't on NaviSpace";
      const actions = document.getElementById("actions");
      actions.innerHTML = "";
      const link = document.createElement("a");
      link.className = "btn btn-primary";
      link.href = libraryUrl("/library.html", libraryId);
      link.textContent = "See the seat map";
      link.style.textDecoration = "none";
      actions.appendChild(link);
      document.getElementById("reportLink").style.display = "none";
      document.getElementById("enableReminders").style.display = "none";
      toast("This code may be from an older seat layout — scan the code on your desk, or pick a seat on the map.");
    }

    // Every action button shows it's working the moment it's tapped and
    // ignores repeat taps until the server answers.
    let busy = false;
    let focusSeat = null;
    function tickSeatFocus() {
      if (!focusSeat) return;
      const s = Math.floor(focusElapsedMs(focusSeat) / 1000);
      const p = (n) => String(n).padStart(2, "0");
      const t = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
      document.getElementById("seatFocusTime").textContent = focusSeat.state === "STEPPED_AWAY" ? `${t} · paused` : t;
    }
    setInterval(tickSeatFocus, 1000);

    function makeButton(label, primary, onClick) {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = "btn" + (primary ? " btn-primary" : "");
      b.onclick = async () => {
        if (busy) return;
        busy = true;
        document.querySelectorAll("#actions .btn").forEach((btn) => btn.setAttribute("aria-busy", "true"));
        b.textContent = label + " …";
        try {
          await onClick();
        } catch {
          toast("Couldn't reach NaviSpace — check your connection and try again.");
          b.textContent = label;
          document.querySelectorAll("#actions .btn").forEach((btn) => btn.removeAttribute("aria-busy"));
        } finally {
          busy = false;
        }
      };
      return b;
    }

    async function refresh() {
      try {
        const seat = await getSeat(libraryId, seatId);
        render(seat);
        return seat;
      } catch {
        // Still unreachable after apiGet's retries: say so, and keep trying.
        document.getElementById("status").textContent = "Connecting…";
        setTimeout(refresh, 3000);
        return null;
      }
    }

    async function act(action) {
      const result = await postScan(libraryId, seatId, action, identity);
      if (!result.ok) {
        if (result.reason === "library_closed") {
          const h = result.hours || {};
          const when = h.nextOpen === "today" ? `at ${h.opens}` : h.nextOpen ? `${h.nextOpen} at ${h.opens}` : "soon";
          toast(`The library is closed${h.closedFor && h.closedFor !== "Weekend" ? ` for ${h.closedFor}` : ""}. Check-ins open again ${when}.`);
        } else if (result.reason === "scan_required") {
          codeRequired = true;
          toast("Scan the code on the desk to check in.");
        } else if (result.reason === "already_holding_seat") {
          toast(`You're already checked into seat ${result.heldSeatId}. Check out there first.`);
        } else {
          toast("Couldn't do that — refreshing status.");
        }
      }
      render(result.seat);

      if (action === "checkIn" || action === "imBack") {
        scheduleNextPrompt();
      }
      if (action === "leaving") {
        clearTimeout(promptTimer);
      }
    }

    function scheduleNextPrompt() {
      clearTimeout(promptTimer);
      // STILL_HERE_PROMPT_INTERVAL_MS in config.js. Just the client timer:
      // the server owns the real expiry.
      promptTimer = setTimeout(showStillStudyingPrompt, 50 * 60 * 1000);
    }

    function showStillStudyingPrompt() {
      document.getElementById("modalMessage").textContent = "Still studying? " + randomEncouragement();
      document.getElementById("modal").style.display = "flex";
    }

    document.getElementById("modalKeepGoing").onclick = async () => {
      document.getElementById("modal").style.display = "none";
      const result = await postScan(libraryId, seatId, "stillHere", identity);
      render(result.seat);
      if (result.ok) {
        toast(randomEncouragement());
        scheduleNextPrompt();
      }
    };
    document.getElementById("modalDone").onclick = async () => {
      document.getElementById("modal").style.display = "none";
      await act("leaving");
    };

    document.getElementById("enableReminders").onclick = async () => {
      const result = await enablePushReminders(identity);
      if (result.ok && result.testSent) {
        reminderEnabled = true;
        toast("Reminders on — you should have just got a test notification.");
        refresh();
      } else if (result.ok) {
        reminderEnabled = true;
        toast("Reminders saved, but the test notification didn't go through — the server's push setup needs checking.");
        refresh();
      } else if (result.reason === "ios_not_installed") {
        toast("On iPhone: tap Share, then \"Add to Home Screen\", and open NaviSpace from the new icon — it opens on this seat, ready for reminders.");
      } else if (result.reason === "unsupported") {
        toast("Reminders aren't supported in this browser.");
      } else if (result.reason === "permission_denied") {
        toast("Notifications blocked — enable them in your browser settings to get reminders.");
      } else if (result.reason === "no_vapid_key") {
        toast("Reminders aren't set up on the server yet.");
      } else {
        toast("Couldn't enable reminders — try again.");
      }
    };

    document.getElementById("reportLink").onclick = async () => {
      const result = await reportSeatWrong(libraryId, seatId, identity);
      if (result.corrected) {
        toast("Thanks — enough reports came in, seat corrected to AVAILABLE.");
        refresh();
      } else {
        toast(`Report recorded (${result.reportCount}/${result.threshold} needed).`);
      }
    };

    refresh();
  </script>
</body>
</html>
