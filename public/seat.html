<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#10182b" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NaviSpace" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<title>NaviSpace — Seat</title>
<style>
  main { display: flex; justify-content: center; }

  .seat-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px 24px;
  }

  .seat-card-label {
    font-size: 0.8rem;
    color: var(--slate);
    margin-bottom: 2px;
  }

  .seat-card-id {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 3rem;
    line-height: 1.05;
    margin-bottom: 18px;
  }

  .status-band {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 12px 14px;
    border-radius: 9px;
    margin-bottom: 18px;
  }

  .status-band.AVAILABLE { background: var(--green-dim); color: var(--green); }
  .status-band.OCCUPIED { background: var(--vermilion-dim); color: #ff8a73; }
  .status-band.STEPPED_AWAY { background: var(--amber-dim); color: var(--amber); }

  .actions { margin-bottom: 4px; }

  #enableReminders { margin-top: 10px; }
  #reportLink { display: block; text-align: left; margin-top: 4px; }

  .nickname-row {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .nickname-row input { flex: 1; min-width: 0; }
  .nickname-row button { width: auto; margin: 0; padding: 9px 14px; font-size: 0.85rem; }

  .modal-box { text-align: center; }
  .modal-box p { margin: 0 0 16px; font-size: 0.95rem; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><span class="wordmark-mark"></span>navispace</a>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <div class="context-bar">
    <span class="library-name" id="libraryName">&nbsp;</span>
    <a href="/">Change library</a>
  </div>

  <main>
    <div class="seat-card">
      <div class="seat-card-label">Seat</div>
      <div class="seat-card-id" id="seatId">…</div>

      <div id="status" class="status-band AVAILABLE">Loading…</div>
      <div id="actions" class="actions"></div>

      <button id="enableReminders" class="btn btn-tinted" style="display:none;">🔔 Enable seat reminders</button>
      <button id="reportLink" class="btn-quiet" style="display:none;">This looks wrong — report it</button>
      <div id="toast" class="toast"></div>

      <div class="nickname-row">
        <input type="text" id="nicknameInput" placeholder="Your leaderboard nickname" maxlength="24" />
        <button id="nicknameSave" class="btn">Save</button>
      </div>
    </div>
  </main>

  <div id="modal" class="modal-overlay">
    <div class="modal-box">
      <p id="modalMessage"></p>
      <button class="btn btn-primary" id="modalKeepGoing">Keep going</button>
      <button class="btn" id="modalDone">I'm done</button>
    </div>
  </div>

  <script src="/client.js"></script>
  <script>
    const seatId = new URLSearchParams(window.location.search).get("seat") || "A1";
    // Defaults to "engineering" — see getLibraryIdFromUrl in client.js:
    // this keeps every QR code printed before multi-library support
    // existed working untouched.
    const libraryId = getLibraryIdFromUrl();
    document.getElementById("seatId").textContent = seatId;

    document.getElementById("topnav").innerHTML = `
      <a href="${libraryUrl("/library.html", libraryId)}">Map</a>
      <a href="${libraryUrl("/leaderboard.html", libraryId)}">Leaderboard</a>
      <a href="${libraryUrl("/lost-found.html", libraryId)}">Lost &amp; Found</a>
    `;
    getLibraries().then((libs) => {
      const lib = libs.find((l) => l.id === libraryId);
      document.getElementById("libraryName").textContent = lib ? lib.name : libraryId;
    });

    const identity = getOrCreateIdentity();
    let promptTimer = null;
    let reminderEnabled = false;

    const nicknameInput = document.getElementById("nicknameInput");
    nicknameInput.value = identity.nickname === "Anonymous" ? "" : identity.nickname;
    document.getElementById("nicknameSave").onclick = () => {
      identity.nickname = setNickname(nicknameInput.value);
      nicknameInput.value = identity.nickname;
      toast("Nickname saved.");
    };

    const ENCOURAGEMENT = [
      "Keep going — you've got this!",
      "Nice focus. Stay with it!",
      "One more stretch. You're doing great.",
      "Still here? Good. Keep the momentum.",
    ];
    function randomEncouragement() {
      return ENCOURAGEMENT[Math.floor(Math.random() * ENCOURAGEMENT.length)];
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 6000);
    }

    function render(seat) {
      const statusEl = document.getElementById("status");
      statusEl.className = "status-band " + seat.state;
      statusEl.innerHTML = "";
      const dot = document.createElement("span");
      dot.className = "signal-dot signal-" + seat.state;
      statusEl.appendChild(dot);
      const label = document.createElement("span");
      label.textContent =
        seat.state === "AVAILABLE" ? "Available" :
        seat.state === "OCCUPIED" ? (seat.holderToken === identity.token ? "You're checked in" : "Occupied") :
        "Stepped away (holding seat)";
      statusEl.appendChild(label);

      const actions = document.getElementById("actions");
      actions.innerHTML = "";

      const isHolder = seat.holderToken === identity.token;

      if (seat.state === "AVAILABLE") {
        actions.appendChild(makeButton("Check in", true, () => act("checkIn")));
      } else if (seat.state === "OCCUPIED" && isHolder) {
        actions.appendChild(makeButton("Step away (hold my seat)", false, () => act("stepAway")));
        actions.appendChild(makeButton("I'm done — check out", false, () => act("leaving")));
      } else if (seat.state === "STEPPED_AWAY" && isHolder) {
        actions.appendChild(makeButton("I'm back", true, () => act("imBack")));
        actions.appendChild(makeButton("I'm done — check out", false, () => act("leaving")));
      } else {
        actions.appendChild(makeButton("Refresh", false, refresh));
      }

      // Crowdsourced correction: only meaningful when the seat claims
      // to be held by someone — reporting an already-AVAILABLE seat
      // has nothing to correct.
      const reportBtn = document.getElementById("reportLink");
      reportBtn.style.display = seat.state === "AVAILABLE" ? "none" : "inline-block";

      // Reminders are only useful to the person actually holding the
      // seat, and only worth offering once (reminderEnabled tracks
      // this tab's own successful subscribe, since there's no cheap
      // way to check push-subscription status without a service
      // worker round trip on every render).
      const reminderBtn = document.getElementById("enableReminders");
      reminderBtn.style.display = isHolder && !reminderEnabled ? "block" : "none";
    }

    function makeButton(label, primary, onClick) {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = "btn" + (primary ? " btn-primary" : "");
      b.onclick = onClick;
      return b;
    }

    async function refresh() {
      const seat = await getSeat(libraryId, seatId);
      render(seat);
      return seat;
    }

    async function act(action) {
      const result = await postScan(libraryId, seatId, action, identity);
      if (!result.ok) {
        if (result.reason === "already_holding_seat") {
          toast(`You're already checked into seat ${result.heldSeatId}. Check out there first.`);
        } else {
          toast("Couldn't do that — refreshing status.");
        }
      }
      render(result.seat);

      if (action === "checkIn" || action === "imBack") {
        scheduleNextPrompt();
      }
      if (action === "leaving") {
        clearTimeout(promptTimer);
      }
    }

    function scheduleNextPrompt() {
      clearTimeout(promptTimer);
      // 15 min in config.js; kept short here isn't necessary since this
      // is just the client timer — server owns the real expiry.
      promptTimer = setTimeout(showStillStudyingPrompt, 15 * 60 * 1000);
    }

    function showStillStudyingPrompt() {
      document.getElementById("modalMessage").textContent = "Still studying? " + randomEncouragement();
      document.getElementById("modal").style.display = "flex";
    }

    document.getElementById("modalKeepGoing").onclick = async () => {
      document.getElementById("modal").style.display = "none";
      const result = await postScan(libraryId, seatId, "stillHere", identity);
      render(result.seat);
      if (result.ok) {
        toast(randomEncouragement());
        scheduleNextPrompt();
      }
    };
    document.getElementById("modalDone").onclick = async () => {
      document.getElementById("modal").style.display = "none";
      await act("leaving");
    };

    document.getElementById("enableReminders").onclick = async () => {
      const result = await enablePushReminders(identity);
      if (result.ok) {
        reminderEnabled = true;
        toast("Reminders on — we'll ping you before your seat frees up.");
        refresh();
      } else if (result.reason === "ios_not_installed") {
        toast("On iPhone: tap Share, then \"Add to Home Screen\" — reopen NaviSpace from there to enable reminders.");
      } else if (result.reason === "unsupported") {
        toast("Reminders aren't supported in this browser.");
      } else if (result.reason === "permission_denied") {
        toast("Notifications blocked — enable them in your browser settings to get reminders.");
      } else if (result.reason === "no_vapid_key") {
        toast("Reminders aren't set up on the server yet.");
      } else {
        toast("Couldn't enable reminders — try again.");
      }
    };

    document.getElementById("reportLink").onclick = async () => {
      const result = await reportSeatWrong(libraryId, seatId, identity);
      if (result.corrected) {
        toast("Thanks — enough reports came in, seat corrected to AVAILABLE.");
        refresh();
      } else {
        toast(`Report recorded (${result.reportCount}/${result.threshold} needed).`);
      }
    };

    refresh();
  </script>
</body>
</html>
