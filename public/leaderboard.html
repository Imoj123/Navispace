<style>
  main { max-width: 480px; }

  .board {
    border-top: 1px solid var(--line);
  }
  .board-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .board-row.top3 {
    background: var(--panel);
    margin: 0 -12px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 18px;
    border-bottom-color: transparent;
  }
  .board-row + .board-row.top3 { margin-top: 2px; }

  .rank {
    font-family: var(--font-display);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--slate);
    width: 1.6em;
    flex-shrink: 0;
  }
  .top3 .rank { color: var(--amber); }

  .name {
    flex: 1;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .points {
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--slate);
  }
  .top3 .points { color: var(--paper); }



  /* --- Lamp over the floor ------------------------------------------------ */
  main { max-width: 620px; }
  .context-bar { max-width: 620px; }
  .board { border-top-color: var(--line); }
  .board-row { border-bottom-color: var(--line); padding: 16px 4px; }
  .board-row.top3 { background: var(--surface); border-radius: 0; margin: 0; padding-left: 14px; padding-right: 14px; border-bottom: 1px solid var(--line); }
  .board-row + .board-row.top3 { margin-top: 0; }
  .rank, .points { font-family: var(--font-mono); font-weight: 500; font-size: 14px; }
  .top3 .rank { color: var(--brass); }
  .name { font: 400 20px/1.2 var(--font-serif); }


  /* --- The week's top three: a podium (2nd, 1st, 3rd), first one tallest. --- */
  .podium {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: end;
    gap: 10px;
    margin: 6px 0 26px;
  }
  .podium:empty { display: none; }
  .podium.settled .step { animation: none; }
  .step {
    display: grid;
    justify-items: center;
    gap: 8px;
    min-width: 0;
    text-align: center;
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .step.p1 { animation-delay: 0.05s; }
  .step.p2 { animation-delay: 0.2s; }
  .step.p3 { animation-delay: 0.3s; }
  .step .who {
    max-width: 100%;
    font: 400 18px/1.2 var(--font-serif);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .step.p1 .who { font-size: 23px; }
  .step .pts {
    font: 400 12px/1 var(--font-mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .step .block {
    width: 100%;
    display: grid;
    place-items: start center;
    padding-top: 14px;
    border: 1px solid var(--line);
    border-bottom: 0;
    background: linear-gradient(180deg, rgba(236, 230, 214, 0.05), rgba(236, 230, 214, 0.01));
    font: 400 clamp(30px, 7vw, 40px)/1 var(--font-serif);
    color: var(--muted);
  }
  .step.p1 .block {
    height: 118px;
    border-color: rgba(196, 163, 95, 0.6);
    background:
      radial-gradient(ellipse 80% 70% at 50% 0%, rgba(228, 192, 118, 0.22), transparent 75%),
      linear-gradient(180deg, rgba(196, 163, 95, 0.1), rgba(196, 163, 95, 0.02));
    color: var(--brass);
    font-style: italic;
  }
  .step.p2 .block { height: 84px; }
  .step.p3 .block { height: 62px; }
  .step .crown {
    white-space: nowrap;
    font: 400 10.5px/1 var(--font-mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .podium-base {
    grid-column: 1 / -1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    margin-top: -10px;
  }
</style>

<body>
  <header class="topbar">
    <a class="wordmark" href="/"><span class="wordmark-mark"></span>NaviSpace</a>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <div class="context-bar">
    <span class="library-name" id="libraryName">&nbsp;</span>
    <a href="/libraries.html" data-change-library>Change library</a>
  </div>

  <main>
    <h1 class="page-title">This week's <em>study board.</em></h1>
    <p class="page-subtitle">One point for each day you study at a seat. The board starts fresh every week.</p>

    <div class="podium" id="podium" aria-label="This week's top three"></div>
    <div class="board" id="list"></div>
    <div class="empty-state" id="empty" style="display:none;">
      <div class="ghost-rows" aria-hidden="true"><span>01</span><span>02</span><span>03</span></div>
      <h2>The board is wide open.</h2>
      <p>Nobody has studied here yet this week. Check in at a seat today and your name goes straight to the top.</p>
      <a class="cta-link" id="emptyMap" href="/library.html">Find a free seat</a>
    </div>
  </main>

  <script src="/client.js"></script>
  <script>
    const libraryId = getLibraryIdFromUrl();

    document.getElementById("topnav").innerHTML = `
      <a href="/">Home</a>
      <a href="${libraryUrl("/library.html", libraryId)}">Map</a>
      <a href="${libraryUrl("/leaderboard.html", libraryId)}" class="current">Study board</a>
      <a href="${libraryUrl("/lost-found.html", libraryId)}">Lost &amp; found</a>
    `;
    getLibraries().then((libs) => {
      const lib = libs.find((l) => l.id === libraryId);
      document.getElementById("libraryName").textContent = lib ? lib.name : libraryId;
    });

    async function render() {
      const entries = await getLeaderboard(libraryId);
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      const podium = document.getElementById("podium");
      list.innerHTML = "";
      podium.innerHTML = "";

      if (!entries.length) {
        empty.style.display = "";
        document.getElementById("emptyMap").href = libraryUrl("/library.html", libraryId);
        return;
      }
      empty.style.display = "none";

      // Equal points share a place (1, 1, 3), so a tie never looks like a loss.
      const ranks = entries.map((e, i) => i);
      entries.forEach((e, i) => { ranks[i] = i && e.sessionDays === entries[i - 1].sessionDays ? ranks[i - 1] : i + 1; });
      const tiedTop = entries.length > 1 && ranks[1] === 1;

      // The top three stand on the podium: second, first, third, left to right.
      const pts = (n) => `${n} pt${n === 1 ? "" : "s"}`;
      for (const place of [2, 1, 3]) {
        const e = entries[place - 1];
        if (!e) { podium.appendChild(document.createElement("div")); continue; }
        const step = document.createElement("div");
        step.className = `step p${place}`;
        step.innerHTML = (place === 1 ? `<span class="crown">${tiedTop ? "Joint leaders" : "This week's leader"}</span>` : "") +
          '<span class="who"></span><span class="pts"></span><div class="block"></div>';
        step.querySelector(".who").textContent = e.nickname;
        step.querySelector(".pts").textContent = pts(e.sessionDays);
        step.querySelector(".block").textContent = ranks[place - 1];
        step.setAttribute("aria-label", `Number ${ranks[place - 1]}: ${e.nickname}, ${pts(e.sessionDays)}`);
        podium.appendChild(step);
      }
      const base = document.createElement("div");
      base.className = "podium-base";
      podium.appendChild(base);
      // Rise in on the first showing only, not on every live refresh.
      setTimeout(() => podium.classList.add("settled"), 1200);

      entries.forEach((e, i) => {
        if (i < 3) return;
        const row = document.createElement("div");
        row.className = "board-row";

        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = String(ranks[i]).padStart(2, "0");

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = e.nickname;

        const points = document.createElement("div");
        points.className = "points";
        points.textContent = `${e.sessionDays} pt${e.sessionDays === 1 ? "" : "s"}`;

        row.append(rank, name, points);
        list.appendChild(row);
      });
    }

    render();
    setInterval(render, 30000);
  </script>
</body>
</html>
