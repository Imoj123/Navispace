<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#10182b" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NaviSpace" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<title>NaviSpace — Leaderboard</title>
<meta name="description" content="See who's logged the most study time this week." />
<meta property="og:type" content="website" />
<meta property="og:title" content="NaviSpace — Leaderboard" />
<meta property="og:description" content="See who's logged the most study time this week." />
<meta property="og:image" content="https://navispace-1.onrender.com/icons/icon-512.png" />
<meta name="twitter:card" content="summary" />
<style>
  main { max-width: 480px; }

  .board {
    border-top: 1px solid var(--line);
  }
  .board-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .board-row.top3 {
    background: var(--panel);
    margin: 0 -12px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 8px;
    border-bottom-color: transparent;
  }
  .board-row + .board-row.top3 { margin-top: 2px; }

  .rank {
    font-family: var(--font-display);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--slate);
    width: 1.6em;
    flex-shrink: 0;
  }
  .top3 .rank { color: var(--amber); }

  .name {
    flex: 1;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .points {
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--slate);
  }
  .top3 .points { color: var(--paper); }

  #empty { text-align: center; color: var(--slate); margin-top: 40px; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><span class="wordmark-mark"></span>navispace</a>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <div class="context-bar">
    <span class="library-name" id="libraryName">&nbsp;</span>
    <a href="/">Change library</a>
  </div>

  <main>
    <h1 class="page-title">Study leaderboard</h1>
    <p class="page-subtitle">One point per seat per day — this week</p>

    <div class="board" id="list"></div>
    <p id="empty" style="display:none;">No sessions yet this week — check in to get on the board.</p>
  </main>

  <script src="/client.js"></script>
  <script>
    const libraryId = getLibraryIdFromUrl();

    document.getElementById("topnav").innerHTML = `
      <a href="${libraryUrl("/library.html", libraryId)}">Map</a>
      <a href="${libraryUrl("/leaderboard.html", libraryId)}" class="current">Leaderboard</a>
      <a href="${libraryUrl("/lost-found.html", libraryId)}">Lost &amp; Found</a>
    `;
    getLibraries().then((libs) => {
      const lib = libs.find((l) => l.id === libraryId);
      document.getElementById("libraryName").textContent = lib ? lib.name : libraryId;
    });

    async function render() {
      const entries = await getLeaderboard(libraryId);
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      list.innerHTML = "";

      if (!entries.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      entries.forEach((e, i) => {
        const row = document.createElement("div");
        row.className = "board-row" + (i < 3 ? " top3" : "");

        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = String(i + 1).padStart(2, "0");

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = e.nickname;

        const points = document.createElement("div");
        points.className = "points";
        points.textContent = `${e.sessionDays} pt${e.sessionDays === 1 ? "" : "s"}`;

        row.append(rank, name, points);
        list.appendChild(row);
      });
    }

    render();
    setInterval(render, 30000);
  </script>
</body>
</html>
