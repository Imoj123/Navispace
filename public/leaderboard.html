<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#121614" />
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NaviSpace" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<title>NaviSpace — Leaderboard</title>
<meta name="description" content="See who's logged the most study time this week." />
<meta property="og:type" content="website" />
<meta property="og:title" content="NaviSpace — Leaderboard" />
<meta property="og:description" content="See who's logged the most study time this week." />
<meta property="og:image" content="https://navispace-1.onrender.com/icons/icon-512.png" />
<meta name="twitter:card" content="summary" />
<style>
  main { max-width: 480px; }

  .board {
    border-top: 1px solid var(--line);
  }
  .board-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .board-row.top3 {
    background: var(--panel);
    margin: 0 -12px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 18px;
    border-bottom-color: transparent;
  }
  .board-row + .board-row.top3 { margin-top: 2px; }

  .rank {
    font-family: var(--font-display);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--slate);
    width: 1.6em;
    flex-shrink: 0;
  }
  .top3 .rank { color: var(--amber); }

  .name {
    flex: 1;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .points {
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--slate);
  }
  .top3 .points { color: var(--paper); }



  /* --- Lamp over the floor ------------------------------------------------ */
  main { max-width: 620px; }
  .context-bar { max-width: 620px; }
  .board { border-top-color: var(--line); }
  .board-row { border-bottom-color: var(--line); padding: 16px 4px; }
  .board-row.top3 { background: var(--surface); border-radius: 0; margin: 0; padding-left: 14px; padding-right: 14px; border-bottom: 1px solid var(--line); }
  .board-row + .board-row.top3 { margin-top: 0; }
  .rank, .points { font-family: var(--font-mono); font-weight: 500; font-size: 14px; }
  .top3 .rank { color: var(--brass); }
  .name { font: 400 20px/1.2 var(--font-serif); }

</style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><span class="wordmark-mark"></span>NaviSpace</a>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <div class="context-bar">
    <span class="library-name" id="libraryName">&nbsp;</span>
    <a href="/">Change library</a>
  </div>

  <main>
    <h1 class="page-title">This week's <em>study board.</em></h1>
    <p class="page-subtitle">One point for each day you study at a seat. The board starts fresh every week.</p>

    <div class="board" id="list"></div>
    <div class="empty-state" id="empty" style="display:none;">
      <div class="ghost-rows" aria-hidden="true"><span>01</span><span>02</span><span>03</span></div>
      <h2>The board is wide open.</h2>
      <p>Nobody has studied here yet this week. Check in at a seat today and your name goes straight to the top.</p>
      <a class="cta-link" id="emptyMap" href="/library.html">Find a free seat</a>
    </div>
  </main>

  <script src="/client.js"></script>
  <script>
    const libraryId = getLibraryIdFromUrl();

    document.getElementById("topnav").innerHTML = `
      <a href="/">Home</a>
      <a href="${libraryUrl("/library.html", libraryId)}">Map</a>
      <a href="${libraryUrl("/leaderboard.html", libraryId)}" class="current">Study board</a>
      <a href="${libraryUrl("/lost-found.html", libraryId)}">Lost &amp; found</a>
    `;
    getLibraries().then((libs) => {
      const lib = libs.find((l) => l.id === libraryId);
      document.getElementById("libraryName").textContent = lib ? lib.name : libraryId;
    });

    async function render() {
      const entries = await getLeaderboard(libraryId);
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      list.innerHTML = "";

      if (!entries.length) {
        empty.style.display = "";
        document.getElementById("emptyMap").href = libraryUrl("/library.html", libraryId);
        return;
      }
      empty.style.display = "none";

      entries.forEach((e, i) => {
        const row = document.createElement("div");
        row.className = "board-row" + (i < 3 ? " top3" : "");

        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = String(i + 1).padStart(2, "0");

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = e.nickname;

        const points = document.createElement("div");
        points.className = "points";
        points.textContent = `${e.sessionDays} pt${e.sessionDays === 1 ? "" : "s"}`;

        row.append(rank, name, points);
        list.appendChild(row);
      });
    }

    render();
    setInterval(render, 30000);
  </script>
</body>
</html>
