<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NaviSpace — Leaderboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; text-align: center; }
  ol { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 8px; margin: 6px 0; background: #f5f5f5; }
  li:nth-child(1) { background: #fff3cd; font-weight: 700; }
  li:nth-child(2) { background: #f0f0f0; font-weight: 600; }
  .rank { color: #888; margin-right: 10px; }
  #empty { text-align: center; color: #888; margin-top: 30px; }
</style>
</head>
<body>
  <h1>Study Leaderboard</h1>
  <p style="text-align:center; color:#888; font-size:0.85rem;">
    One point per seat per day — this week
  </p>
  <ol id="list"></ol>
  <p id="empty" style="display:none;">No sessions yet this week — check in to get on the board!</p>

  <script src="/client.js"></script>
  <script>
    async function render() {
      const entries = await getLeaderboard();
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      list.innerHTML = "";

      if (!entries.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      entries.forEach((e, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span><span class="rank">#${i + 1}</span>${escapeHtml(e.nickname)}</span><span>${e.sessionDays} pt${e.sessionDays === 1 ? "" : "s"}</span>`;
        list.appendChild(li);
      });
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    render();
    setInterval(render, 30000);
  </script>
</body>
</html>
